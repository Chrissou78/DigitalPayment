version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: payduka-db
    environment:
      POSTGRES_USER: payduka
      POSTGRES_PASSWORD: payduka_secret
      POSTGRES_DB: payduka
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payduka"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payduka-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  redis_data:
