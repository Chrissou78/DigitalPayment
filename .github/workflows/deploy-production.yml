name: Deploy Production

on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build all
        run: pnpm build:all
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.PROD_API_URL }}

      # ── Migrations ──
      - name: Run database migrations
        run: pnpm --filter @payduka/api migration:run
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DB_SSL: "true"
          NODE_ENV: production

      # ── Deploy API ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/payduka-api:${{ github.ref_name }}
            ${{ vars.REGISTRY_URL }}/payduka-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy Admin ──
      - name: Deploy admin to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: apps/admin-dashboard

      # ── Health check ──
      - name: Health check
        run: |
          sleep 30
          curl --fail --retry 5 --retry-delay 10 \
            ${{ vars.PROD_API_URL }}/health \
            || exit 1
