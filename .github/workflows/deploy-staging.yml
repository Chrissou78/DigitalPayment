name: Deploy Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # ── Build in dependency order ──
      - name: Build shared
        run: pnpm --filter @payduka/shared build

      - name: Build API
        run: pnpm --filter @payduka/api build

      - name: Build admin dashboard
        run: pnpm --filter @payduka/admin-dashboard build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}

      # ── Run migrations ──
      - name: Run database migrations
        run: pnpm --filter @payduka/api migration:run
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DB_SSL: "true"

      # ── Deploy API ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/payduka-api:staging
            ${{ vars.REGISTRY_URL }}/payduka-api:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy Admin Dashboard to Vercel ──
      - name: Deploy admin to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
          working-directory: apps/admin-dashboard

      # ── Post-deploy health check ──
      - name: Health check
        run: |
          sleep 30
          curl --fail --retry 5 --retry-delay 10 \
            ${{ vars.STAGING_API_URL }}/health \
            || exit 1
